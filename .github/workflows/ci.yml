name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Shell scripts
        run: |
          shellcheck install.sh update.sh uninstall.sh
          bash -n install.sh update.sh uninstall.sh

  build:
    name: Build the binary file
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            registry.gitlab.com/rust_musl_docker/image:stable-latest \
            sh -lc 'cd /workdir && cargo build --locked --profile=fast -vv --target=x86_64-unknown-linux-musl'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliroaming-rust-server-${{ github.ref_name }}-${{ github.run_number }}
          path: ./target/x86_64-unknown-linux-musl/fast/biliroaming_rust_server
          if-no-files-found: error
          retention-days: 30
